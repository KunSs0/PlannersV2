# 战士示例树。主动技能和属性节点由 category=active/attribute 归入同一页面；
# passive 分类技能会由客户端归入被动页面，不需要额外 page 配置。
warrior_vanguard:
  name: "先锋战士"
  class: none
  type: base

  nodes:
    slash:
      type: skill
      skill: slash
      position: { x: 0, y: 80 }
      maxLevel: 3
      levels:
        1: { player_lv: { min: 1 }, consume_sp: { amount: 1 } }
        2: { player_lv: { min: 4 }, consume_sp: { amount: 1 } }
        3: { player_lv: { min: 8 }, consume_sp: { amount: 2 } }

    strength_1:
      type: attribute
      position: { x: 96, y: 20 }
      maxLevel: 3
      provider:
        id: attribute
        values:
          STR: 2
      levels:
        1: { player_lv: { min: 1 }, consume_sp: { amount: 1 } }
        2: { player_lv: { min: 5 }, consume_sp: { amount: 1 } }
        3: { player_lv: { min: 10 }, consume_sp: { amount: 2 } }

    charge:
      type: skill
      skill: charge
      position: { x: 192, y: 80 }
      maxLevel: 3
      levels:
        1: { player_lv: { min: 3 }, consume_sp: { amount: 1 } }
        2: { player_lv: { min: 7 }, consume_sp: { amount: 2 } }
        3: { player_lv: { min: 12 }, consume_sp: { amount: 2 } }

    passive_toughness:
      type: skill
      skill: passive_toughness
      position: { x: 0, y: 180 }
      maxLevel: 3
      levels:
        1: { player_lv: { min: 1 }, consume_sp: { amount: 1 } }
        2: { player_lv: { min: 5 }, consume_sp: { amount: 1 } }
        3: { player_lv: { min: 10 }, consume_sp: { amount: 2 } }

    passive_rage:
      type: skill
      skill: passive_rage
      position: { x: 112, y: 180 }
      maxLevel: 3
      levels:
        1: { player_lv: { min: 3 }, consume_sp: { amount: 1 } }
        2: { player_lv: { min: 8 }, consume_sp: { amount: 2 } }
        3: { player_lv: { min: 14 }, consume_sp: { amount: 2 } }

  graph:
    slash: []
    strength_1:
      - node: slash
        minLevel: 1
    charge:
      - node: strength_1
        minLevel: 2
    passive_toughness: []
    passive_rage:
      - node: passive_toughness
        minLevel: 1
