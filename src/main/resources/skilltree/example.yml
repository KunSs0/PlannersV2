# 最小技能树示例。节点通过 type 明确区分技能和属性，页面由技能 category 派生。
example_tree:
  name: "示例"
  class: none
  type: base

  nodes:
    example0:
      type: skill
      skill: example0
      position: { x: 0, y: 0 }
      maxLevel: 1
      levels:
        1:
          player_lv: { min: 1 }
          consume_sp: { amount: 1 }
    strength_1:
      type: attribute
      position: { x: 80, y: 0 }
      maxLevel: 1
      provider:
        id: attribute
        values:
          STR: 2
      levels:
        1:
          player_lv: { min: 1 }
          consume_sp: { amount: 1 }

  graph:
    example0: []
    strength_1:
      - node: example0
        minLevel: 1
