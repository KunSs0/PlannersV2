__option__:
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
  name: "批量操作测试"
  category: [active]

action: |
  import "planners.core"

  fun execute() {
    // 测试默认 sender (不传 targets，使用 LeastType.SENDER)
    ProxyDamage.Companion.of(this.sender.getInstance(), 10).execute()
    this.sender.getInstance().setHealth(min(this.sender.getInstance().getHealth() + 5, this.sender.getInstance().getMaxHealth()))

    // 使用 finder 链式选择器选择目标
    var targets = TargetFinder(this.sender.getBukkitLocation(), this.sender.getInstance()).range(8).excludeType("player").limit(5).build()
    for (target in targets) {
      ProxyDamage.Companion.of(target.getInstance(), 20).execute()
    }

    // 测试药水效果 (默认 sender)
    val speed = PotionEffectType.getByName("SPEED")
    this.sender.getInstance().addPotionEffect(PotionEffect(speed, 200, 0, false, true))

    // 测试速度 (指定目标)
    for (target in targets) {
      val entity = target.getInstance()
      entity.setVelocity(entity.getVelocity().add(Vector(0, 1, 0)))
    }

    // 测试状态
    for (target in targets) {
      target.getInstance().setFreezeTicks(100)
      target.getInstance().setFireTicks(60)
    }

    // 测试声音 (默认 sender)
    val player = this.sender.getInstance()
    player.playSound(player.getLocation(), Sound.valueOf("ENTITY_PLAYER_LEVELUP"), 1.0, 1.0)

    this.sender.sendMessage("技能执行完毕")
  }
