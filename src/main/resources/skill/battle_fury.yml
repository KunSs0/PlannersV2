__option__:
  name: "战斗狂热"
  category: [active]
  display:
    icon:
      material: BLAZE_POWDER
      name: "&e战斗狂热"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7攻击速度 &c{{attack_speed}}%"
        - "&7持续 &b{{duration}}&7秒"
  variables:
    cooldown: 150
    attack_speed: 10 * level + 50
    duration: 2 * level + 5
  max-level: 6
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&a战斗狂热 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
