__option__:
  name: "冲锋"
  category: [active]
  display:
    icon:
      material: IRON_BOOTS
      name: "&e冲锋"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7速度 &b{{speed}}%"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 80
    speed: 15 * level + 80
  max-level: 3
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&a冲锋 Lv" + level)
  }
