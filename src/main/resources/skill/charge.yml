__option__:
  name: "冲锋"
  category: [active]
  display:
    icon:
      material: IRON_BOOTS
      name: "&e冲锋"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7速度 &b{{speed}}%"
  variables:
    cooldown: 80
    speed: 15 * level + 80
  max-level: 3
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&a冲锋 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
