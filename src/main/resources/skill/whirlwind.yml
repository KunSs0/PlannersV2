__option__:
  name: "旋风斩"
  category: [active]
  display:
    icon:
      material: IRON_SWORD
      name: "&a旋风斩"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7范围 &a{{range}}&7格"
        - "&7伤害 &a{{damage}}"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 90
    range: level + 2
    damage: 18 * level + 40
  max-level: 10
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&a旋风斩 Lv" + this.level)
  }
