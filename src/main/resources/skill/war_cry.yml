__option__:
  name: "战吼"
  category: [active]
  display:
    icon:
      material: GOAT_HORN
      name: "&e战吼"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7攻击加成 &c{{attack_buff}}%"
        - "&7持续 &b{{duration}}&7秒"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 120
    attack_buff:
      expression: 5 * level + 10
    duration:
      expression: 3 * level
  max-level: 5
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&a战吼 Lv" + this.level)
  }
