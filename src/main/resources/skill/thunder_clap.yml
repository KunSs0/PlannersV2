__option__:
  name: "雷霆一击"
  category: [active]
  display:
    icon:
      material: LIGHTNING_ROD
      name: "&e雷霆一击"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7伤害 &e{{damage}}"
        - "&7麻痹 &e{{stun_duration}}&7秒"
  variables:
    cooldown: 120
    damage: 25 * level + 50
    stun_duration: 1 + level / 3
  max-level: 8
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&e雷霆一击 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
