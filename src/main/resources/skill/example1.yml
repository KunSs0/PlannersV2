__option__:
  name: "x1"
  category: [active]
  display:
    icon:
      material: DIAMOND_SWORD
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 100
    damage:
      expression: 32 * level + 100
    rectX: [4, 1, 3, 4]
    rectZ: [2, 4, 3, 3]

action: |
  import "planners.core"

  fun execute() {
    // 获取当前状态索引，默认为 0
    var idx = if (this.sender.hasMetadata("x1.status")) this.sender.getMetadata("x1.status") else 0

    // rectX/rectZ 为 variables 定义的数组，需通过 skill 获取
    var rectX = [4, 1, 3, 4]
    var rectZ = [2, 4, 3, 3]

    var x = rectX[idx]
    var z = rectZ[idx]

    this.sender.sendMessage("idx=" + idx + ",x=" + x + ", z=" + z)

    // 检查是否到达最后一个索引
    if (idx == 3) {
      idx = -1
    }

    // 更新状态
    this.sender.setMetadata("x1.status", idx + 1)
  }
