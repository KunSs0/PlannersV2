__option__:
  name: "x1"
  category: [active]
  display:
    icon:
      material: DIAMOND_SWORD
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 100
    damage: "32 * skill.level + 100"
    rectX: [4, 1, 3, 4]
    rectZ: [2, 4, 3, 3]

# 状态轮转示例：读一次共享标记得到下标，按下标取两轴坐标，再把下标推进一位。
action:
  fire:
    - 'meta.get{key="x1.status"; to="idx"; default=0} @self'
    - 'message{m="idx=<skill.idx>,x=<skill.rectX[skill.idx]>, z=<skill.rectZ[skill.idx]>"} @self'
    - 'meta.set{key="x1.status"; value=<skill.idx == 3 ? 0 : skill.idx + 1>} @self'
