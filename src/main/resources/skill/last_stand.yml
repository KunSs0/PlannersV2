__option__:
  name: "绝境求生"
  category: [active]
  display:
    icon:
      material: TOTEM_OF_UNDYING
      name: "&6绝境求生"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7血量低于&c30%&7时触发"
        - "&7恢复 &c{{heal}} &7生命"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 600
    heal:
      expression: 50 * level + 100
  max-level: 1
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&6绝境求生触发")
  }
