__option__:
  name: "裂地"
  category: [active]
  display:
    icon:
      material: STONE_PICKAXE
      name: "&8裂地"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7伤害 &8{{damage}}"
        - "&7击退 &8{{knockback}}&7格"
  variables:
    cooldown: 150
    damage: 40 * level + 100
    knockback: 2 * level
  max-level: 14
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&8裂地 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
