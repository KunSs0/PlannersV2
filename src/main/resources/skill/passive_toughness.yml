__option__:
  name: "坚韧"
  category: [passive]
  display:
    icon:
      material: IRON_CHESTPLATE
      name: "&7坚韧"
      lore:
        - "&7等级 &fLv<skill.level>"
        - "&7防御 &7+<skill.var.defense>"
        - "&7被动"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    defense: "4 * skill.level + 5"
  max-level: 6
  # 属性键必须是当前属性驱动的物理属性 ID，本示例使用 FightCore 的 defense。
  hook:
    attributes:
      defense: "skill.var.defense"
