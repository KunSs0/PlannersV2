__option__:
  name: "反击"
  category: [active]
  display:
    icon:
      material: IRON_CHESTPLATE
      name: "&e反击"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7反伤 &c{{reflect}}%"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 80
    reflect:
      expression: 20 * level + 40
  max-level: 4
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&e反击 Lv" + this.level)
  }
