__option__:
  name: "反击"
  category: [active]
  display:
    icon:
      material: IRON_CHESTPLATE
      name: "&e反击"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7反伤 &c{{reflect}}%"
  variables:
    cooldown: 80
    reflect: 20 * level + 40
  max-level: 4
action: |
  fun execute() {
    sender.sendMessage("&e反击 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
