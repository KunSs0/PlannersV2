__option__:
  name: "嗜血"
  category: [active]
  display:
    icon:
      material: RED_DYE
      name: "&4嗜血"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7吸血 &4{{lifesteal}}%"
        - "&7持续 &4{{duration}}&7秒"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 180
    lifesteal: 15 * level + 25
    duration: 5 * level
  max-level: 2
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&4嗜血 Lv" + this.level)
  }
