__option__:
  name: "嗜血"
  category: [active]
  display:
    icon:
      material: RED_DYE
      name: "&4嗜血"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7吸血 &4{{lifesteal}}%"
        - "&7持续 &4{{duration}}&7秒"
  variables:
    cooldown: 180
    lifesteal: 15 * level + 25
    duration: 5 * level
  max-level: 2
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&4嗜血 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
