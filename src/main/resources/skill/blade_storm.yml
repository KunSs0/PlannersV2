__option__:
  name: "剑刃风暴"
  category: [active]
  display:
    icon:
      material: DIAMOND_SWORD
      name: "&b剑刃风暴"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7段数 &b{{hits}}"
        - "&7每段伤害 &b{{damage_per_hit}}"
  variables:
    cooldown: 300
    hits: 2 * level + 5
    damage_per_hit: 15 * level + 60
  max-level: 18
action: |
  fun execute() {
    sender.sendMessage("&b剑刃风暴 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
