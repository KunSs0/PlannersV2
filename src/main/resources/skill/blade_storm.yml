__option__:
  name: "剑刃风暴"
  category: [active]
  display:
    icon:
      material: DIAMOND_SWORD
      name: "&b剑刃风暴"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7段数 &b{{hits}}"
        - "&7每段伤害 &b{{damage_per_hit}}"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 300
    hits:
      expression: 2 * level + 5
    damage_per_hit:
      expression: 15 * level + 60
  max-level: 18
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&b剑刃风暴 Lv" + this.level)
  }
