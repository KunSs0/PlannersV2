__option__:
  name: "重斩"
  category: [active]
  display:
    icon:
      material: DIAMOND_AXE
      name: "&c重斩"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7伤害 &c{{damage}}"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 100
    damage:
      expression: 35 * level + 80
  max-level: 15
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&c释放重斩 Lv" + this.level)
  }
