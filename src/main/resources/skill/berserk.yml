__option__:
  name: "狂暴"
  category: [active]
  display:
    icon:
      material: REDSTONE
      name: "&4狂暴"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7伤害加成 &4{{damage_buff}}%"
        - "&7受伤增加 &8{{damage_taken}}%"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 200
    damage_buff:
      expression: 6 * level + 20
    damage_taken:
      expression: 3 * level + 10
  max-level: 18
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("&4狂暴 Lv" + this.level)
  }
