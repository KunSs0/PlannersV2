__option__:
  name: "盾击"
  category: [active]
  display:
    icon:
      material: SHIELD
      name: "&e盾击"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7眩晕 &c{{stun}}&7秒"
        - "&7伤害 &c{{damage}}"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 100
    stun:
      expression: 1 + level
    damage:
      expression: 10 * level + 30
  max-level: 3
action: |
  fun execute() {
    this.sender.sendMessage("&a盾击 Lv" + this.level)
  }
