__option__:
  name: "盾击"
  category: [active]
  display:
    icon:
      material: SHIELD
      name: "&e盾击"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7眩晕 &c{{stun}}&7秒"
        - "&7伤害 &c{{damage}}"
  variables:
    cooldown: 100
    stun: 1 + level
    damage: 10 * level + 30
  max-level: 3
action: |
  import "planners.core"

  fun main() {
    sender.sendMessage("&a盾击 Lv" + level)
    Cooler.INSTANCE.set(sender.getInstance(), skill, cooldown)
  }
