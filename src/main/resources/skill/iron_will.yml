__option__:
  name: "钢铁意志"
  category: [active]
  display:
    icon:
      material: NETHERITE_SCRAP
      name: "&e钢铁意志"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7防御加成 &9{{defense_buff}}%"
        - "&7持续 &b{{duration}}&7秒"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 100
    defense_buff:
      expression: 8 * level + 20
    duration:
      expression: 4 * level
  max-level: 4
action: |
  fun execute() {
    this.sender.sendMessage("&a钢铁意志 Lv" + this.level)
  }
