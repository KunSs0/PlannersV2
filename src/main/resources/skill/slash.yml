__option__:
  name: "斩击"
  category: [active]
  display:
    icon:
      material: IRON_SWORD
      name: "&e斩击"
      lore:
        - "&7等级 &fLv{{level}}"
        - "&7伤害 &c{{damage}}"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 60
    damage:
      expression: 20 * level + 50
  max-level: 3
action: |
  fun execute() {
    this.sender.sendMessage("&a释放斩击 Lv" + this.level)
    ProxyDamage.Companion.builder().source(this.sender.getInstance()).target(this.target.getInstance()).damage(this.damage).cause(DamageCause.Companion.of("SKILL")).build().execute()
  }
