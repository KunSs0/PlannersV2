__option__:
  name: "裂地斩"
  category: [active]

  display:
    icon:
      material: DIAMOND_SWORD
      name: "裂地斩"
      lore:
        - "技能等级 {{level}}"
        - "技能伤害 {{damage}}"
  variables:
    cooldown: 100
    damage: 32 * level + 100
  hook:
    attributes:
      - "攻击力 +${10 * level}"
action: |
  import "planners.core"

  fun main() {
    Cooler.INSTANCE.set(sender.getInstance(), skill, 200)
    sender.sendMessage("技能释放成功")
  }

  fun handleHit() {
    sender.sendMessage("on hit " + target)
  }
