__option__:
  name: "裂地斩"
  category: [active]

  display:
    icon:
      material: DIAMOND_SWORD
      name: "裂地斩"
      lore:
        - "技能等级 {{level}}"
        - "技能伤害 {{damage}}"
  variables:
    cooldown: 100
    damage: 32 * level + 100
  hook:
    attributes:
      - "攻击力 +${10 * level}"
action: |
  fun onCooldownReady() {
    Cooler.INSTANCE.set(sender.getInstance(), skill, 200)
  }

  fun execute() {
    sender.sendMessage("技能释放成功")
    WorkspaceTasks.later(1500, __workspaceEntry, "onCooldownReady")
  }

  fun handleHit() {
    sender.sendMessage("on hit " + target)
  }
