__option__:
  name: "裂地斩"
  category: [active]

  display:
    icon:
      material: DIAMOND_SWORD
      name: "裂地斩"
      lore:
        - "技能等级 {{level}}"
        - "技能伤害 {{damage}}"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    cooldown: 100
    damage: 32 * level + 100
  hook:
    attributes:
      - "攻击力 +${10 * level}"
action: |
  import "planners.core"

  fun execute() {
    this.sender.sendMessage("技能释放成功")
  }

  fun handleHit() {
    this.sender.sendMessage("on hit " + this.target)
  }
