__option__:
  name: "怒火"
  category: [passive]
  display:
    icon:
      material: BLAZE_ROD
      name: "&6怒火"
      lore:
        - "&7等级 &fLv<skill.level>"
        - "&7攻击 &6+<skill.var.power>"
        - "&7被动"
  variables:
    castTime: 0 # 显式瞬发；非零值为基础施法tick，独立于动作动画。
    power: "3 * skill.level + 2"
  max-level: 5
  # 属性键必须是当前属性驱动的物理属性 ID，本示例使用 FightCore 的 damage。
  hook:
    attributes:
      damage: "skill.var.power"
